version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql-sigma
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sigma_db
      MYSQL_USER: user
      MYSQL_PASSWORD: user
    ports:
      - "3307:3306" # Puerto 3307 para no interferir si alguien tiene otro MySQL
    volumes:
      - mysql_sigma_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  mysql_sigma_data: